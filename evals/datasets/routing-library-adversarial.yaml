schemaVersion: 1
id: routing-library-adversarial
split: dev
locale: en
protected: false
examples:
  - id: adv-frame-not-brainstorm
    prompt: Define the real problem, constraints, and success criteria; do not
      generate solutions yet.
    expectedCategory: problem-framing
    expectedAtoms:
      - atom-frame-problem
    mustNotRoute:
      - atom-brainstorm-options
  - id: adv-brainstorm-not-decide
    prompt: Generate alternative ideas with materially different premises; do not
      score or choose a winner.
    expectedCategory: ideation-planning
    expectedAtoms:
      - atom-brainstorm-options
    mustNotRoute:
      - atom-compare-decisions
  - id: adv-literature-not-links
    prompt: Synthesize these papers into agreements, conflicts, and research gaps; I
      already have the sources.
    expectedCategory: scientific-research
    expectedAtoms:
      - atom-review-literature
    mustNotRoute:
      - atom-find-research-sources
  - id: adv-find-not-review
    prompt: Find authoritative sources as scientific paper links with relevance
      notes only; do not synthesize a literature review.
    expectedCategory: research-knowledge
    expectedAtoms:
      - atom-find-research-sources
    mustNotRoute:
      - atom-review-literature
  - id: adv-prd-not-architecture
    prompt: Define product requirements, user stories, and acceptance criteria;
      leave system architecture undecided.
    expectedCategory: product-definition
    expectedAtoms:
      - atom-write-product-requirements
    mustNotRoute:
      - atom-design-software-architecture
  - id: adv-architecture-not-code
    prompt: Create a system design with component boundaries and data flow; do not
      implement code.
    expectedCategory: software-design
    expectedAtoms:
      - atom-design-software-architecture
    mustNotRoute:
      - atom-implement-code-change
  - id: adv-debug-not-fix
    prompt: Reproduce this software failure and find the root cause; diagnose only
      and do not edit files.
    expectedCategory: code-quality-delivery
    expectedAtoms:
      - atom-debug-software
    mustNotRoute:
      - atom-implement-code-change
  - id: adv-code-review-not-security
    prompt: Review this code change for correctness, tests, and regressions; do not
      perform a security review.
    expectedCategory: code-quality-delivery
    expectedAtoms:
      - atom-review-code-quality
    mustNotRoute:
      - atom-audit-source-security
  - id: adv-spreadsheet-edit-not-analysis
    prompt: Edit these workbook cells and preserve formulas and formatting; do not
      interpret the metrics.
    expectedCategory: productivity-tools
    expectedAtoms:
      - atom-operate-spreadsheet
    mustNotRoute:
      - atom-analyze-tabular-data
  - id: adv-design-tool-not-design
    prompt: Apply this design in Figma from the approved specification and preserve
      components; do not invent a new visual direction.
    expectedCategory: design-tools
    expectedAtoms:
      - atom-operate-design-tool
    mustNotRoute:
      - atom-design-interface-spec
  - id: adv-summary-not-translation
    prompt: Summarize this document for executives while preserving caveats; do not
      translate it.
    expectedCategory: documents-communication
    expectedAtoms:
      - atom-summarize-document
    mustNotRoute:
      - atom-translate-document
  - id: adv-clean-not-analyze
    prompt: Clean this dataset by normalizing columns and deduplicating rows; do not
      interpret the business metrics.
    expectedCategory: data-analytics
    expectedAtoms:
      - atom-clean-tabular-data
    mustNotRoute:
      - atom-analyze-tabular-data
  - id: adv-schema-not-migration
    prompt: Design tables, relationships, keys, and constraints for a new database;
      do not migrate live data.
    expectedCategory: software-design
    expectedAtoms:
      - atom-design-database-schema
    mustNotRoute:
      - atom-plan-database-migration
  - id: adv-roadmap-not-requirements
    prompt: Prioritize these feature opportunities by outcome, evidence, effort, and
      risk; do not write detailed requirements.
    expectedCategory: product-definition
    expectedAtoms:
      - atom-prioritize-product-roadmap
    mustNotRoute:
      - atom-write-product-requirements
  - id: adv-copy-not-strategy
    prompt: Write landing page copy for this defined audience and offer; do not
      design the whole content strategy.
    expectedCategory: business-growth
    expectedAtoms:
      - atom-write-marketing-copy
    mustNotRoute:
      - atom-plan-content-strategy
  - id: adv-threat-not-audit
    prompt: Create a threat model with assets, trust boundaries, actors, and abuse
      paths; do not scan source code.
    expectedCategory: security-trust
    expectedAtoms:
      - atom-create-threat-model
    mustNotRoute:
      - atom-audit-source-security
  - id: adv-runbook-not-live
    prompt: Write an operational runbook with diagnostics, stop conditions,
      rollback, and escalation; do not execute production commands.
    expectedCategory: automation-operations
    expectedAtoms:
      - atom-write-operational-runbook
    mustNotRoute:
      - atom-triage-production-incident
  - id: adv-diagram-not-architecture
    prompt: Draw the approved architecture as an editable technical diagram; do not
      invent system boundaries.
    expectedCategory: design-media
    expectedAtoms:
      - atom-create-technical-diagram
    mustNotRoute:
      - atom-design-software-architecture
  - id: adv-image-edit-not-generate
    prompt: Edit this supplied image by removing the background while preserving the
      subject; do not generate a new scene.
    expectedCategory: design-media
    expectedAtoms:
      - atom-edit-image
    mustNotRoute:
      - atom-generate-image
  - id: adv-notes-not-vault
    prompt: Turn this meeting transcript into structured notes with decisions and
      actions; do not reorganize the whole knowledge vault.
    expectedCategory: personal-productivity
    expectedAtoms:
      - atom-capture-structured-notes
    mustNotRoute:
      - atom-operate-knowledge-vault
  - id: adv-peer-review-not-rewrite
    prompt: Peer review this manuscript for methods, claims, and reproducibility; do
      not rewrite it.
    expectedCategory: scientific-research
    expectedAtoms:
      - atom-peer-review-manuscript
    mustNotRoute:
      - atom-edit-prose
