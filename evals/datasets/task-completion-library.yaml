schemaVersion: 1
id: task-completion-library
split: dev
locale: en
protected: false
examples:
  - id: task-frame-problem
    prompt: Frame this ambiguous retention problem.
    expectedCategory: problem-framing
    expectedAtoms:
      - atom-frame-problem
    mustNotRoute:
      - atom-brainstorm-options
    task: Return goals, constraints, assumptions, stakeholders, non-goals, unknowns,
      and observable success criteria without proposing solutions.
    rubric:
      - Separates outcomes from means
      - States assumptions and unknowns
      - Defines observable success
      - Does not propose solutions
  - id: task-study-design
    prompt: Design a reproducible research study.
    expectedCategory: scientific-research
    expectedAtoms:
      - atom-design-research-study
    mustNotRoute:
      - atom-analyze-experimental-results
    task: Produce a protocol with hypothesis, estimand, sampling, variables,
      controls, analysis, missing data, ethics, and validity threats.
    rubric:
      - Defines hypothesis and estimand
      - Specifies sampling and controls
      - Predeclares analysis
      - Addresses ethics and validity
  - id: task-api-contract
    prompt: Design an API contract without implementing it.
    expectedCategory: software-design
    expectedAtoms:
      - atom-design-api-contract
    mustNotRoute:
      - atom-implement-code-change
    task: Specify operations, schemas, validation, errors, authorization,
      idempotency, examples, and compatibility rules.
    rubric:
      - Defines request and response schemas
      - Defines error behavior
      - Covers authorization and idempotency
      - Includes compatibility tests
  - id: task-git-operation
    prompt: Operate a safe Git workflow.
    expectedCategory: developer-tools
    expectedAtoms:
      - atom-operate-git-workflow
    mustNotRoute:
      - atom-implement-code-change
    task: Inspect state, preserve unrelated work, run one authorized operation, and
      verify status, diff, and history.
    rubric:
      - Inspects repository state
      - Preserves unrelated changes
      - Uses a bounded operation
      - Verifies resulting history
  - id: task-data-cleaning
    prompt: Clean this customer table reproducibly.
    expectedCategory: data-analytics
    expectedAtoms:
      - atom-clean-tabular-data
    mustNotRoute:
      - atom-analyze-tabular-data
    task: Profile quality, define normalization rules, preserve raw inputs, apply
      reproducible transformations, and validate keys, types, row counts, and
      anomalies.
    rubric:
      - Profiles data quality
      - Declares transformation rules
      - Preserves source lineage
      - Validates the cleaned result
  - id: task-threat-model
    prompt: Create a threat model for this service.
    expectedCategory: security-trust
    expectedAtoms:
      - atom-create-threat-model
    mustNotRoute:
      - atom-audit-source-security
    task: Map assets, actors, flows, entry points, trust boundaries, abuse cases,
      controls, residual risk, and prioritized verification.
    rubric:
      - Defines assets and objectives
      - Maps trust boundaries
      - Prioritizes realistic abuse paths
      - Links mitigations to verification
  - id: task-launch-plan
    prompt: Plan this product launch.
    expectedCategory: business-growth
    expectedAtoms:
      - atom-plan-product-launch
    mustNotRoute:
      - atom-plan-software-release
    task: Create a launch plan with audience, positioning, channels, readiness
      gates, owners, metrics, risks, and fallback actions.
    rubric:
      - Defines audience and positioning
      - Assigns readiness ownership
      - Specifies measurable outcomes
      - Includes risks and fallback actions
  - id: task-observability
    prompt: Design observability for this service.
    expectedCategory: automation-operations
    expectedAtoms:
      - atom-design-observability
    mustNotRoute:
      - atom-triage-production-incident
    task: Define user journeys, SLIs, SLOs, telemetry, dashboards, actionable
      alerts, ownership, retention, cost, and review cadence.
    rubric:
      - Connects signals to user outcomes
      - Defines SLOs and telemetry
      - Makes alerts actionable
      - Addresses ownership and cost
  - id: task-learning-path
    prompt: Plan a measurable learning path for this goal.
    expectedCategory: personal-productivity
    expectedAtoms:
      - atom-plan-learning-path
    mustNotRoute:
      - atom-build-action-plan
    task: Assess baseline, decompose prerequisites, sequence resources and practice,
      and define feedback, spaced review, checkpoints, and adaptation rules.
    rubric:
      - Uses learner baseline and constraints
      - Sequences prerequisites and practice
      - Includes feedback and retrieval
      - Defines adaptive checkpoints
  - id: task-peer-review
    prompt: Peer review this scientific manuscript.
    expectedCategory: scientific-research
    expectedAtoms:
      - atom-peer-review-manuscript
    mustNotRoute:
      - atom-edit-prose
    task: Summarize claims and methods, identify evidence-located major and minor
      issues, assess reproducibility and ethics, and ask constructive questions
      without an editorial verdict.
    rubric:
      - Accurately frames claims and methods
      - Locates and prioritizes findings
      - Checks reproducibility and ethics
      - Avoids rewriting or editorial verdicts
