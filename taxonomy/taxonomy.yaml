schemaVersion: 1
version: 0.2.0
maxDepth: 3
nodes:
  - id: software-engineering
    label:
      en: Software engineering
      zh-CN: 软件工程
    description:
      en: Create, change, verify, ship, or operate executable software artifacts.
      zh-CN: 创建、修改、验证、发布或运行可执行的软件产物。
    includes:
      - creating or changing source code
      - debugging and testing software behavior
      - designing software architecture
    excludes:
      - general research that does not change software
      - visual design without implementation
    boundaryExamples:
      - A security review routes to security-trust first even when the artifact is code.
    keywords:
      en: [code, software, bug, test, refactor, repository, api, application, implement, patch]
      zh-CN: [代码, 代码修改, 软件, 修复, 测试, 重构, 仓库, 接口, 应用, 实现, 补丁]
  - id: research-knowledge
    label:
      en: Research and knowledge
      zh-CN: 研究与知识
    description:
      en: Discover, synthesize, cite, or maintain knowledge and evidence.
      zh-CN: 发现、综合、引用或维护知识与证据。
    includes:
      - evidence-backed research
      - literature and knowledge synthesis
      - knowledge-base organization
    excludes:
      - implementing source code as the primary outcome
      - producing a polished business document without research
      - vulnerability review
    boundaryExamples:
      - A researched report routes here for evidence gathering, then to documents for production.
    keywords:
      en: [research, evidence, sources, literature, knowledge, citation, investigate]
      zh-CN: [研究, 证据, 来源, 文献, 知识, 引用, 调研]
  - id: data-analytics
    label:
      en: Data and analytics
      zh-CN: 数据与分析
    description:
      en: Transform, query, model, calculate, or visualize structured data.
      zh-CN: 转换、查询、建模、计算或可视化结构化数据。
    includes:
      - spreadsheet and database analysis
      - statistical or quantitative modeling
      - structured-data visualization
    excludes:
      - prose-only research synthesis
      - operating a production data service
    boundaryExamples:
      - Creating a chart from a dataset routes here; styling a brand illustration routes to design-media.
    keywords:
      en: [data, spreadsheet, database, sql, statistics, chart, metrics, analysis]
      zh-CN: [数据, 表格, 数据库, 统计, 图表, 指标, 分析]
  - id: documents-communication
    label:
      en: Documents and communication
      zh-CN: 文档与沟通
    description:
      en: Create or transform human-readable documents, presentations, and messages.
      zh-CN: 创建或转换供人阅读的文档、演示和消息。
    includes:
      - writing and editing documents
      - translation and summarization
      - presentations and external messages
    excludes:
      - executable source-code changes
      - image or video production as the primary artifact
    boundaryExamples:
      - Data analysis routes to data-analytics before its narrative is turned into a report here.
    keywords:
      en: [document, pdf, word, slide, presentation, translate, memo, report, email]
      zh-CN: [文档, PDF, Word, 幻灯片, 演示, 翻译, 报告, 邮件]
  - id: design-media
    label:
      en: Design and media
      zh-CN: 设计与媒体
    description:
      en: Design interfaces or create and transform visual, audio, and video media.
      zh-CN: 设计界面或创建、转换图像、音频和视频媒体。
    includes:
      - user interface and experience design
      - image, audio, and video generation or editing
      - diagrams whose primary purpose is visual communication
    excludes:
      - frontend implementation when code is the primary artifact
      - data charts whose correctness is the primary goal
    boundaryExamples:
      - A UI specification routes here; coding the specified UI routes to software-engineering.
    keywords:
      en: [design, ui, ux, image, video, audio, diagram, visual, layout]
      zh-CN: [设计, 界面, 体验, 图像, 视频, 音频, 图表, 视觉, 布局]
  - id: business-growth
    label:
      en: Business and growth
      zh-CN: 商业与增长
    description:
      en: Improve markets, sales, marketing, finance, and business decisions.
      zh-CN: 改善市场、销售、营销、财务和商业决策。
    includes:
      - market and competitor analysis
      - marketing, sales, and growth workflows
      - business and investment analysis
    excludes:
      - generic evidence research with no business decision
      - personal task tracking
    boundaryExamples:
      - Market research belongs here while the underlying web evidence collection may use research atoms.
    keywords:
      en: [business, market, sales, marketing, seo, customer, investment, finance, growth]
      zh-CN: [商业, 市场, 销售, 营销, 客户, 投资, 财务, 增长]
  - id: automation-operations
    label:
      en: Automation and operations
      zh-CN: 自动化与运营
    description:
      en: Connect systems, schedule work, deploy services, and operate repeatable workflows.
      zh-CN: 连接系统、调度工作、部署服务并运行可重复流程。
    includes:
      - workflow automation and orchestration
      - deployment and infrastructure operations
      - recurring jobs and monitoring
    excludes:
      - one-off code implementation without an operational outcome
      - personal reminders with no system integration
    boundaryExamples:
      - Writing deployment code may use software atoms, but operating the deployment routes here.
    keywords:
      en: [automation, workflow, deploy, operations, monitor, schedule, integration, cloud]
      zh-CN: [自动化, 工作流, 部署, 运维, 监控, 定时, 集成, 云]
  - id: personal-productivity
    label:
      en: Personal productivity
      zh-CN: 个人效率
    description:
      en: Manage an individual's tasks, notes, calendar, memory, and attention.
      zh-CN: 管理个人任务、笔记、日历、记忆和注意力。
    includes:
      - task and calendar management
      - personal notes and memory
      - individual planning routines
    excludes:
      - organization-wide workflow automation
      - shared knowledge governance
    boundaryExamples:
      - A personal recurring reminder routes here; a cross-system scheduled pipeline routes to automation-operations.
    keywords:
      en: [task, todo, calendar, reminder, notes, memory, productivity, personal]
      zh-CN: [任务, 待办, 日历, 提醒, 笔记, 记忆, 效率, 个人]
  - id: security-trust
    label:
      en: Security and trust
      zh-CN: 安全与信任
    description:
      en: Identify, prevent, or govern security, privacy, safety, and integrity risks.
      zh-CN: 识别、预防或治理安全、隐私、可靠性和完整性风险。
    includes:
      - security audits and threat analysis
      - permission and secret review
      - trust and provenance verification
    excludes:
      - ordinary functional debugging
      - quality review without a security or trust property
    boundaryExamples:
      - Vulnerability review routes here even when source code is inspected.
    keywords:
      en: [security, vulnerability, threat, audit, permission, secret, privacy, provenance]
      zh-CN: [安全, 漏洞, 威胁, 审计, 权限, 密钥, 隐私, 来源]
  - id: skill-agent-governance
    label:
      en: Skill and agent governance
      zh-CN: Skill 与 Agent 治理
    description:
      en: Classify, compose, evaluate, release, and evolve agent capabilities and harnesses.
      zh-CN: 分类、组合、评测、发布和进化 Agent 能力与 Harness。
    includes:
      - creating and classifying Agent Skills
      - evaluating routing and task completion
      - governed self-improvement and rollback
    excludes:
      - using a domain Skill to perform its normal task
      - generic model training unrelated to skills
    boundaryExamples:
      - Improving a coding Skill routes here; using that Skill to edit code routes to software-engineering.
    keywords:
      en: [skill, agent, mcp, harness, routing, evaluation, taxonomy, self-improving]
      zh-CN: [技能, 智能体, MCP, Harness, 路由, 评测, 分类, 自优化]
  - id: problem-solving
    label: { en: Problem solving, zh-CN: 问题研究 }
    description: { en: "Frame ambiguous problems and turn them into options, decisions, plans, or critiques.", zh-CN: "将模糊问题转化为问题框架、备选方案、决策、计划或评审。" }
    includes: [problem framing, brainstorming, general action planning, decision comparison, output critique]
    excludes: [domain execution that already has a specialized category, source-code implementation]
    boundaryExamples: [A general plan routes here; a repository implementation plan routes to software engineering.]
    keywords:
      en: [problem, brainstorm, ideate, plan, decision, compare, critique, review]
      zh-CN: [问题, 头脑风暴, 创意, 计划, 决策, 比较, 批判, 评审]
  - id: problem-framing
    parent: problem-solving
    label: { en: Problem framing, zh-CN: 问题定义 }
    description: { en: "Clarify goals, constraints, stakeholders, assumptions, and success criteria before solving.", zh-CN: "在求解前澄清目标、约束、相关方、假设与成功标准。" }
    includes: [problem statements, scope clarification, assumption mapping]
    excludes: [generating solution options, executing a domain task]
    boundaryExamples: [Use this when the question itself is unclear; use ideation when the question is clear but options are needed.]
    keywords:
      en: [frame problem, define problem, clarify scope, assumptions, constraints]
      zh-CN: [定义问题, 澄清范围, 假设, 约束, 成功标准]
  - id: ideation-planning
    parent: problem-solving
    label: { en: Ideation and planning, zh-CN: 构思与计划 }
    description: { en: Generate distinct options and convert a selected direction into an executable plan., zh-CN: 生成差异化方案并将选定方向转化为可执行计划。 }
    includes: [brainstorming, option generation, action plans]
    excludes: [formal decision scoring, implementation itself]
    boundaryExamples: [Brainstorm before selecting; plan only after a direction and constraints are known.]
    keywords:
      en: [brainstorm, generate options, action plan, roadmap, steps]
      zh-CN: [头脑风暴, 生成方案, 行动计划, 路线图, 步骤]
  - id: decision-review
    parent: problem-solving
    label: { en: Decision and review, zh-CN: 决策与评审 }
    description: { en: Compare options against criteria or critique an artifact against an explicit rubric., zh-CN: 按标准比较方案，或依据明确量规评审产物。 }
    includes: [decision matrices, trade-off analysis, rubric-based critique]
    excludes: [open-ended ideation, security-specific audits]
    boundaryExamples: [A security review remains in security and trust even when it uses a rubric.]
    keywords:
      en: [compare options, decision matrix, tradeoff, critique, evaluate output]
      zh-CN: [比较方案, 决策矩阵, 权衡, 批判, 评估产物]
  - id: scientific-research
    parent: research-knowledge
    label: { en: Scientific research, zh-CN: 科学研究 }
    description: { en: "Review scholarship, design studies, analyze experimental results, and prepare traceable manuscripts.", zh-CN: "综述学术证据、设计研究、分析实验结果并形成可追溯论文。" }
    includes: [literature review, research design, experimental analysis, scholarly manuscripts, citation management]
    excludes: [generic web research, unsupported medical decisions]
    boundaryExamples: [Finding papers may use source discovery; synthesizing them into a literature review routes here.]
    keywords:
      en: [scientific, literature review, experiment, study design, manuscript, citation]
      zh-CN: [科学研究, 文献综述, 实验, 研究设计, 论文, 引用]
  - id: product-definition
    parent: software-engineering
    label: { en: Product definition, zh-CN: 产品定义 }
    description: { en: "Define user problems, requirements, acceptance criteria, and product scope before software design.", zh-CN: "在软件设计前定义用户问题、需求、验收标准与产品范围。" }
    includes: [product requirements, user stories, acceptance criteria]
    excludes: [system architecture, coding]
    boundaryExamples: [Define what and why here; decide technical structure in software design.]
    keywords:
      en: [product requirements, prd, user story, acceptance criteria, product scope]
      zh-CN: [产品需求, 需求文档, 用户故事, 验收标准, 产品范围]
  - id: software-design
    parent: software-engineering
    label: { en: Software design, zh-CN: 软件设计 }
    description: { en: Design system structures and interface contracts before implementation., zh-CN: 在实现前设计系统结构与接口契约。 }
    includes: [software architecture, API contracts, component boundaries]
    excludes: [product requirements, code mutation]
    boundaryExamples: [An API schema belongs here; implementing its handlers belongs to software engineering execution.]
    keywords:
      en: [software architecture, system design, api contract, component boundary]
      zh-CN: [软件架构, 系统设计, API契约, 组件边界]
  - id: code-quality-delivery
    parent: software-engineering
    label: { en: Code quality and delivery, zh-CN: 代码质量与交付 }
    description: { en: "Debug, test, review, optimize, and release software with explicit evidence.", zh-CN: "通过明确证据调试、测试、评审、优化并发布软件。" }
    includes: [debugging, automated testing, code review, performance optimization, release planning]
    excludes: [security audits, initial product definition]
    boundaryExamples: [Ordinary defects route here; exploitable vulnerabilities route to security and trust.]
    keywords:
      en: [debug, automated test, code review, performance, release plan]
      zh-CN: [调试, 自动测试, 代码评审, 性能, 发布计划]
  - id: software-use
    label: { en: Software use, zh-CN: 软件使用 }
    description: { en: "Operate named software tools through bounded, reviewable procedures without redefining their domain logic.", zh-CN: "通过有边界、可审查的流程操作指定软件工具，而不重新定义其领域逻辑。" }
    includes: [developer tool operation, productivity software operation, design tool operation]
    excludes: [building the software itself, silently performing external side effects]
    boundaryExamples: [Using Git routes here; changing Git's implementation routes to software engineering.]
    keywords:
      en: [use software, operate tool, cli, browser, spreadsheet, obsidian, figma]
      zh-CN: [使用软件, 操作工具, 命令行, 浏览器, 表格, Obsidian, Figma]
  - id: developer-tools
    parent: software-use
    label: { en: Developer tools, zh-CN: 开发工具 }
    description: { en: "Operate version control, terminals, browsers, and developer consoles safely.", zh-CN: "安全操作版本控制、终端、浏览器与开发者控制台。" }
    includes: [Git workflows, terminal commands, browser developer workflows]
    excludes: [writing product code, general office software]
    boundaryExamples: [A Git rebase operation routes here; designing a branching policy may route to software engineering.]
    keywords:
      en: [git workflow, terminal, cli, browser workflow, devtools]
      zh-CN: [Git工作流, 终端, 命令行, 浏览器工作流, 开发者工具]
  - id: productivity-tools
    parent: software-use
    label: { en: Productivity tools, zh-CN: 效率软件 }
    description: { en: Operate spreadsheets and knowledge tools while preserving structure and user control., zh-CN: 在保留结构和用户控制的前提下操作表格与知识工具。 }
    includes: [spreadsheet operation, knowledge vault operation, structured note tools]
    excludes: [statistical conclusions, personal task prioritization]
    boundaryExamples: [Editing cells routes here; interpreting the resulting metrics routes to data and analytics.]
    keywords:
      en: [spreadsheet operation, excel, knowledge vault, obsidian, notes tool]
      zh-CN: [操作表格, Excel, 知识库, Obsidian, 笔记工具]
  - id: design-tools
    parent: software-use
    label: { en: Design tools, zh-CN: 设计软件 }
    description: { en: Operate design applications from an explicit artifact specification., zh-CN: 根据明确的产物规格操作设计应用。 }
    includes: [Figma operation, canvas editing, design-system tooling]
    excludes: [open-ended visual direction, frontend implementation]
    boundaryExamples: [Creating the visual spec routes to design and media; applying it in Figma routes here.]
    keywords:
      en: [figma operation, design tool, canvas edit, design system tool]
      zh-CN: [Figma操作, 设计工具, 画布编辑, 设计系统工具]
