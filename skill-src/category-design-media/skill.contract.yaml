schemaVersion: 1
id: category-design-media
kind: category
version: 0.1.0
name:
  en: Design and media Router
  zh-CN: 设计与媒体路由器
summary:
  en: Route design and media requests to the smallest certified Atomic Skill.
  zh-CN: 将设计与媒体请求路由到最小的已认证原子 Skill。
outcomes:
  - Bounded design-media category decision
artifacts:
  - category-route
  - localized-index
inputs:
  - name: request
    type: user-prompt
    required: true
outputs:
  - name: candidates
    type: category-and-atom-candidates
    required: true
preconditions:
  - The versioned taxonomy and localized index are available
failures:
  - The requested outcome does not fit the declared category boundary
sideEffects:
  - filesystem-read
permissions:
  network: none
  filesystem: read
  shell: none
  secrets: none
  externalCommunication: none
taxonomy:
  primaryCategory: design-media
  lifecycle:
    - analyze
  modalities:
    - text
    - structured-data
  dependencies:
    - tool-agnostic
  risk: read-only
routing:
  positiveTriggers:
    en:
      - design
      - ui
      - ux
      - image
      - video
      - audio
    zh-CN:
      - 设计
      - 界面
      - 体验
      - 图像
      - 视频
      - 音频
  negativeTriggers:
    en:
      - frontend implementation when code is the primary artifact
      - data charts whose correctness is the primary goal
    zh-CN:
      - 超出该分类边界的请求
  confusableWith: []
provenance:
  origin: local-synthesis
  license: Apache-2.0
evaluations:
  - routing-library-en
  - routing-library-zh-cn
