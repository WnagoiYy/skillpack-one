  lifecycle:
    - analyze
    - verify
  modalities:
    - text
  dependencies:
    - tool-agnostic
  risk: read-only
routing:
  positiveTriggers:
    en:
      - analyze experiment results
      - test this scientific hypothesis
      - interpret this study dataset
    zh-CN:
      - 分析实验结果
      - 检验科学假设
      - 解读研究数据
  negativeTriggers:
