schemaVersion: 1
id: category-documents-communication
kind: category
version: 0.1.0
name:
  en: Documents and communication Router
  zh-CN: 文档与沟通路由器
summary:
  en: Route documents and communication requests to the smallest certified Atomic
    Skill.
  zh-CN: 将文档与沟通请求路由到最小的已认证原子 Skill。
outcomes:
  - Bounded documents-communication category decision
artifacts:
  - category-route
  - localized-index
inputs:
  - name: request
    type: user-prompt
    required: true
outputs:
  - name: candidates
    type: category-and-atom-candidates
    required: true
preconditions:
  - The versioned taxonomy and localized index are available
failures:
  - The requested outcome does not fit the declared category boundary
sideEffects:
  - filesystem-read
permissions:
  network: none
  filesystem: read
  shell: none
  secrets: none
  externalCommunication: none
taxonomy:
  primaryCategory: documents-communication
  lifecycle:
    - analyze
  modalities:
    - text
    - structured-data
  dependencies:
    - tool-agnostic
  risk: read-only
routing:
  positiveTriggers:
    en:
      - document
      - pdf
      - word
      - slide
      - presentation
      - translate
    zh-CN:
      - 文档
      - PDF
      - Word
      - 幻灯片
      - 演示
      - 翻译
  negativeTriggers:
    en:
      - executable source-code changes
      - image or video production as the primary artifact
    zh-CN:
      - 超出该分类边界的请求
  confusableWith: []
provenance:
  origin: local-synthesis
  license: Apache-2.0
evaluations:
  - routing-library-en
  - routing-library-zh-cn
