schemaVersion: 1
id: category-code-quality-delivery
kind: category
version: 0.1.0
name:
  en: Code quality and delivery Router
  zh-CN: 代码质量与交付路由器
summary:
  en: Route code quality and delivery requests to the smallest certified Atomic
    Skill.
  zh-CN: 将代码质量与交付请求路由到最小的已认证原子 Skill。
outcomes:
  - Bounded code-quality-delivery category decision
artifacts:
  - category-route
  - localized-index
inputs:
  - name: request
    type: user-prompt
    required: true
outputs:
  - name: candidates
    type: category-and-atom-candidates
    required: true
preconditions:
  - The versioned taxonomy and localized index are available
failures:
  - The requested outcome does not fit the declared category boundary
sideEffects:
  - filesystem-read
permissions:
  network: none
  filesystem: read
  shell: none
  secrets: none
  externalCommunication: none
taxonomy:
  primaryCategory: code-quality-delivery
  lifecycle:
    - analyze
  modalities:
    - text
    - structured-data
  dependencies:
    - tool-agnostic
  risk: read-only
routing:
  positiveTriggers:
    en:
      - debug
      - automated test
      - code review
      - performance
      - release plan
    zh-CN:
      - 调试
      - 自动测试
      - 代码评审
      - 性能
      - 发布计划
  negativeTriggers:
    en:
      - security audits
      - initial product definition
    zh-CN:
      - 超出该分类边界的请求
  confusableWith: []
provenance:
  origin: local-synthesis
  license: Apache-2.0
evaluations:
  - routing-library-en
  - routing-library-zh-cn
