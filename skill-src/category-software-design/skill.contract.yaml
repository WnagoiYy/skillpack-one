schemaVersion: 1
id: category-software-design
kind: category
version: 0.1.0
name:
  en: Software design Router
  zh-CN: 软件设计路由器
summary:
  en: Route software design requests to the smallest certified Atomic Skill.
  zh-CN: 将软件设计请求路由到最小的已认证原子 Skill。
outcomes:
  - Bounded software-design category decision
artifacts:
  - category-route
  - localized-index
inputs:
  - name: request
    type: user-prompt
    required: true
outputs:
  - name: candidates
    type: category-and-atom-candidates
    required: true
preconditions:
  - The versioned taxonomy and localized index are available
failures:
  - The requested outcome does not fit the declared category boundary
sideEffects:
  - filesystem-read
permissions:
  network: none
  filesystem: read
  shell: none
  secrets: none
  externalCommunication: none
taxonomy:
  primaryCategory: software-design
  lifecycle:
    - analyze
  modalities:
    - text
    - structured-data
  dependencies:
    - tool-agnostic
  risk: read-only
routing:
  positiveTriggers:
    en:
      - software architecture
      - system design
      - api contract
      - component boundary
    zh-CN:
      - 软件架构
      - 系统设计
      - API契约
      - 组件边界
  negativeTriggers:
    en:
      - product requirements
      - code mutation
    zh-CN:
      - 超出该分类边界的请求
  confusableWith: []
provenance:
  origin: local-synthesis
  license: Apache-2.0
evaluations:
  - routing-library-en
  - routing-library-zh-cn
