schemaVersion: 1
id: meta-upstream-skill-curator
kind: meta
version: 0.1.0
name:
  en: Upstream Skill Curator
  zh-CN: 上游 Skill 策展器
summary:
  en: Discover, mirror, fingerprint, license-check, classify, and deduplicate
    external Skills as untrusted design evidence.
  zh-CN: 将外部 Skill 作为不可信设计证据进行发现、镜像、指纹、许可证检查、分类与去重。
outcomes:
  - Auditable upstream Skill evidence set
artifacts:
  - upstream-inventory
  - classification-report
  - deduplication-report
  - curation-proposal
inputs:
  - name: sources
    type: source-list
    required: true
outputs:
  - name: proposal
    type: governed-curation-proposal
    required: true
preconditions:
  - Source scope trust tier snapshot time and intended evidence use are declared
failures:
  - Upstream code would need to execute
  - License or provenance is insufficient
  - Collection cannot be reproduced from fixed revisions
sideEffects:
  - network-read
  - filesystem-read
  - filesystem-write
  - shell-execution
permissions:
  network: read
  filesystem: workspace-write
  shell: allowlisted
  secrets: none
  externalCommunication: none
taxonomy:
  primaryCategory: skill-agent-governance
  lifecycle:
    - discover
    - analyze
    - govern
  modalities:
    - text
    - structured-data
    - system-state
  dependencies:
    - cli-backed
    - harness-backed
  risk: reversible-write
routing:
  positiveTriggers:
    en:
      - collect upstream skills
      - curate a skill evidence library
      - deduplicate external skills
    zh-CN:
      - 收集上游 Skill
      - 策展 Skill 证据库
      - 去重外部 Skill
  negativeTriggers:
    en:
      - author one local skill
      - install unreviewed skill code
      - approve a release
    zh-CN:
      - 创作一个本地 Skill
      - 安装未审查 Skill 代码
      - 批准发布
  confusableWith:
    - meta-skill-author
    - meta-skill-governor
    - atom-classify-capability
provenance:
  origin: local-synthesis
  license: Apache-2.0
  derivedFrom:
    - catalog/upstream-skill-inventory.yaml
evaluations:
  - routing-meta-library-en
  - routing-meta-library-zh-cn
  - governance-protected
