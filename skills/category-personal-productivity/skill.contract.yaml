schemaVersion: 1
id: category-personal-productivity
kind: category
version: 0.1.0
name:
  en: Personal productivity Router
  zh-CN: 个人效率路由器
summary:
  en: Route personal productivity requests to the smallest certified Atomic Skill.
  zh-CN: 将个人效率请求路由到最小的已认证原子 Skill。
outcomes:
  - Bounded personal-productivity category decision
artifacts:
  - category-route
  - localized-index
inputs:
  - name: request
    type: user-prompt
    required: true
outputs:
  - name: candidates
    type: category-and-atom-candidates
    required: true
preconditions:
  - The versioned taxonomy and localized index are available
failures:
  - The requested outcome does not fit the declared category boundary
sideEffects:
  - filesystem-read
permissions:
  network: none
  filesystem: read
  shell: none
  secrets: none
  externalCommunication: none
taxonomy:
  primaryCategory: personal-productivity
  lifecycle:
    - analyze
  modalities:
    - text
    - structured-data
  dependencies:
    - tool-agnostic
  risk: read-only
routing:
  positiveTriggers:
    en:
      - task
      - todo
      - calendar
      - reminder
      - notes
      - memory
    zh-CN:
      - 任务
      - 待办
      - 日历
      - 提醒
      - 笔记
      - 记忆
  negativeTriggers:
    en:
      - organization-wide workflow automation
      - shared knowledge governance
    zh-CN:
      - 超出该分类边界的请求
  confusableWith: []
provenance:
  origin: local-synthesis
  license: Apache-2.0
evaluations:
  - routing-library-en
  - routing-library-zh-cn
