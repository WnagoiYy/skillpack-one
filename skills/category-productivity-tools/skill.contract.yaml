schemaVersion: 1
id: category-productivity-tools
kind: category
version: 0.1.0
name:
  en: Productivity tools Router
  zh-CN: 效率软件路由器
summary:
  en: Route productivity tools requests to the smallest certified Atomic Skill.
  zh-CN: 将效率软件请求路由到最小的已认证原子 Skill。
outcomes:
  - Bounded productivity-tools category decision
artifacts:
  - category-route
  - localized-index
inputs:
  - name: request
    type: user-prompt
    required: true
outputs:
  - name: candidates
    type: category-and-atom-candidates
    required: true
preconditions:
  - The versioned taxonomy and localized index are available
failures:
  - The requested outcome does not fit the declared category boundary
sideEffects:
  - filesystem-read
permissions:
  network: none
  filesystem: read
  shell: none
  secrets: none
  externalCommunication: none
taxonomy:
  primaryCategory: productivity-tools
  lifecycle:
    - analyze
  modalities:
    - text
    - structured-data
  dependencies:
    - tool-agnostic
  risk: read-only
routing:
  positiveTriggers:
    en:
      - spreadsheet operation
      - excel
      - knowledge vault
      - obsidian
      - notes tool
    zh-CN:
      - 操作表格
      - Excel
      - 知识库
      - Obsidian
      - 笔记工具
  negativeTriggers:
    en:
      - statistical conclusions
      - personal task prioritization
    zh-CN:
      - 超出该分类边界的请求
  confusableWith: []
provenance:
  origin: local-synthesis
  license: Apache-2.0
evaluations:
  - routing-library-en
  - routing-library-zh-cn
